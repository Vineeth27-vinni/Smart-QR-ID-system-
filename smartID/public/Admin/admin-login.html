<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SmartID Admin Login</title>
  <link rel="stylesheet" href="/CSS/admin-login.css">
</head>
<body>

  <div class="bg-circle"></div>
  <div class="bg-circle"></div>
  <div class="bg-circle"></div>

  <div class="badge">SmartID Portal</div>

  <div class="card">

    <div class="card-header">
      <div class="icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
        </svg>
      </div>
      <h2>Admin Login</h2>
      <p>SmartID Management System</p>
    </div>

    <div class="card-body">

      <div id="errorMsg" class="error-msg">
        Invalid username or password. Please try again.
      </div>

      <form action="/admin/login" method="POST">

        <input type="hidden" name="role" value="admin">

        <div class="input-group">
          <label>Username</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
            <input type="text" name="username" placeholder="Enter admin username" autocomplete="off" required>
          </div>
        </div>

        <div class="input-group">
          <label>Password</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zm-6 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm3.1-9H8.9V6a3.1 3.1 0 0 1 6.2 0v2z"/></svg>
            <input type="password" name="password" id="passwordInput" placeholder="Enter password" autocomplete="new-password" required>
            <span class="eye-btn" onclick="togglePassword()">
              <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.7 7.6 1 12c1.7 4.4 6 7.5 11 7.5s9.3-3.1 11-7.5C21.3 7.6 17 4.5 12 4.5zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
            </span>
          </div>
        </div>

        <button type="submit" class="btn-login">
          <span>Login</span>
        </button>

      </form>

      <div class="divider"><span>or</span></div>

      <a href="/Registration/Dashboard.html" class="btn-new-login">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
        New Login
      </a>

      <a href="/" class="back-link">← Back to Home</a>

    </div>

  </div>

  <script>
    // Show error if redirected with ?error=1
    const params = new URLSearchParams(window.location.search);
    if (params.get("error") === "1") {
      document.getElementById("errorMsg").style.display = "block";
    }

    // Toggle password visibility
    function togglePassword() {
      const input = document.getElementById("passwordInput");
      const icon  = document.getElementById("eyeIcon");
      if (input.type === "password") {
        input.type = "text";
        icon.querySelector("path").setAttribute("d",
          "M17.9 5.1L6.1 16.9A9.9 9.9 0 0 1 2 12C3.7 7.6 7.6 4.5 12 4.5c2 0 3.9.6 5.5 1.6zm1.4 1.4A9.8 9.8 0 0 1 22 12c-1.7 4.4-6 7.5-11 7.5a9.9 9.9 0 0 1-5.5-1.6L17.9 6.5zM3.5 3.5l17 17-1.4 1.4-17-17 1.4-1.4z"
        );
      } else {
        input.type = "password";
        icon.querySelector("path").setAttribute("d",
          "M12 4.5C7 4.5 2.7 7.6 1 12c1.7 4.4 6 7.5 11 7.5s9.3-3.1 11-7.5C21.3 7.6 17 4.5 12 4.5zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"
        );
      }
    }
  </script>

</body>
</html>
