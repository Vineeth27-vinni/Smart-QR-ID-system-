<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set Password - SmartID</title>

<link rel="stylesheet" href="/CSS/setPassword.css">

</head>

<body>

<div class="container">

<h2>Student First-Time Login</h2>

<form id="verifyForm">



<div class="row">

<div>
<label>Student ID</label>
<input type="text" id="student_id" required>
</div>
<br>

<div>
<label>Full Name</label>
<input type="text" id="name" required>
</div>

</div>

<div class="row">

<div>
<label>Department</label>

<select id="department" onchange="updateCourses()" required>
<option value="">Select Department</option>
<option>School of Computer and Information Science</option>
<option>School of Physics</option>
<option>School of Chemistry</option>
<option>School of Mathematics</option>
<option>School of Life Sciences</option>
<option>School of Management</option>
</select>

</div>

<div>
<label>Course</label>

<select id="course" required>
<option value="">Select Course</option>
</select>

</div>

</div>

<button type="button" onclick="sendOTP()">Verify & Send OTP</button>

</form>


<!-- OTP SECTION -->

<div id="otpSection" style="display:none;">

<h3>Enter OTP</h3>

<input type="text" id="otp" placeholder="Enter OTP">

<button onclick="verifyOTP()">Verify OTP</button>

</div>


<!-- PASSWORD SECTION -->

<div id="passwordSection" style="display:none;">

<h3>Create Password</h3>

<input type="password" id="password" placeholder="Enter Password">
<input type="password" id="confirmPassword" placeholder="Confirm Password">

<button onclick="setPassword()">Set Password</button>

</div>

</div>


<script>

/* COURSE MAPPING */

const coursesByDepartment = {

"School of Computer and Information Science":[
"I.Mtech CSE",
"M.Tech Computer Science-AI",
"M.Tech Computer Science-Data Science"
],

"School of Physics":[
"B.Sc Physics",
"M.Sc Physics"
],

"School of Chemistry":[
"B.Sc Chemistry",
"M.Sc Chemistry"
],

"School of Management":[
"MBA"
]

};


/* UPDATE COURSES */

function updateCourses(){

const dept = document.getElementById("department").value;
const courseDropdown = document.getElementById("course");

courseDropdown.innerHTML = '<option value="">Select Course</option>';

if(coursesByDepartment[dept]){

coursesByDepartment[dept].forEach(course=>{

const option = document.createElement("option");
option.value = course;
option.text = course;

courseDropdown.appendChild(option);

});

}

}


/* SEND OTP */

function sendOTP(){

const data = {
student_id: document.getElementById("student_id").value,
name: document.getElementById("name").value,
department: document.getElementById("department").value,
course: document.getElementById("course").value
};

fetch("/students/send-otp",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(data)
})
.then(res=>res.text())
.then(msg=>{
alert(msg);
document.getElementById("otpSection").style.display="block";
});

}


/* VERIFY OTP */

function verifyOTP(){

const otp = document.getElementById("otp").value;

fetch("/students/verify-otp",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({otp})
})
.then(res=>res.text())
.then(msg=>{
alert(msg);

if(msg === "OTP Verified"){
document.getElementById("passwordSection").style.display="block";
}
});

}


/* SET PASSWORD */

function setPassword(){

const password = document.getElementById("password").value;
const confirmPassword = document.getElementById("confirmPassword").value;

if(password !== confirmPassword){
return alert("Passwords do not match");
}

fetch("/students/set-password",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({password})
})
.then(res=>res.text())
.then(msg=>{
alert(msg);
window.location.href="/student/login";
});

}

</script>

</body>
</html>
