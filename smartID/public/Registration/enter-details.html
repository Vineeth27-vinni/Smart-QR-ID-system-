<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Details | SmartID</title>
    <link rel="stylesheet" href="/CSS/setPassword.css">
</head>
<body>
    <div class="container">
        <div class="stepper">
            <div class="step active">
                <div class="step-icon">1</div>
                <div class="step-label">Verify</div>
            </div>
            <div class="step">
                <div class="step-icon">2</div>
                <div class="step-label">OTP</div>
            </div>
            <div class="step">
                <div class="step-icon">3</div>
                <div class="step-label">Secure</div>
            </div>
        </div>

        <h2>Identity Verification</h2>
        <p class="subtitle">Enter your official details to receive a security OTP.</p>

        <div class="form-group">
            <label>Student ID</label>
            <input type="text" id="student_id" placeholder="e.g. 26MCCE001" required>
        </div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="As per registration" required>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Department</label>
                <select id="department" onchange="updateCourses()">
                    <option value="">Select Department</option>
                    <option value="School of Computer and Information Science">Computer Science</option>
                    <option value="School of Physics">Physics</option>
                    <option value="School of Chemistry">Chemistry</option>
                    <option value="School of Mathematics">Mathematics</option>
                    <option value="School of Life Sciences">Life Sciences</option>
                    <option value="School of Management">Management</option>
                </select>
            </div>

            <div class="form-group">
                <label>Course</label>
                <select id="course">
                    <option value="">Select Course</option>
                </select>
            </div>
        </div>

        <button onclick="sendOTP()" id="mainBtn">
            <span id="btnText">Send Verification OTP</span>
            <div id="spinner" class="spinner"></div>
        </button>

        <div id="toast" class="toast"></div>
    </div>

    <script src="/JS/page1.js"></script>
    <script>
        const coursesByDepartment = {
            "School of Computer and Information Science": ["I.Mtech CSE", "M.Tech Computer Science-AI", "M.Tech Computer Science-Data Science", "M.Tech Computer Science", "PHD Computer Science"],
            "School of Physics": ["B.Sc Physics", "M.Sc Physics", "PHD Physics"],
            "School of Chemistry": ["B.Sc Chemistry", "M.Sc Chemistry", "PHD Chemistry"],
            "School of Mathematics": ["B.Sc Mathematics", "M.Sc Mathematics", "PHD Mathematics"],
            "School of Life Sciences": ["B.Sc Life Sciences", "M.Sc Life Sciences", "PHD Life Sciences"],
            "School of Management": ["MBA"]
        };

        function updateCourses() {
            const dept = document.getElementById("department").value;
            const courseDropdown = document.getElementById("course");
            courseDropdown.innerHTML = '<option value="">Select Course</option>';
            if (coursesByDepartment[dept]) {
                coursesByDepartment[dept].forEach(course => {
                    const option = document.createElement("option");
                    option.value = course;
                    option.text = course;
                    courseDropdown.appendChild(option);
                });
            }
        }
    </script>
</body>
</html>
