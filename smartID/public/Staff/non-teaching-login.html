<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-Teaching Staff Login | SmartID</title>
    <link rel="stylesheet" href="/Staff/CSS/warden-login.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">S</div>
                <h1>Staff Portal</h1>
                <p>Welcome! Please select your department and login.</p>
            </div>
            
            <form id="loginForm" action="/staff/login" method="POST">
                <div class="form-group">
                    <label>Login As</label>
                    <div class="input-wrapper">
                        <i>🏢</i>
                        <select name="role" required style="background: transparent; border: none; color: white; width: 100%; padding: 12px 10px; font-family: inherit; font-size: 1rem; cursor: pointer; outline: none; appearance: none;">
                            <option value="" style="background: #1e293b;">Select Role</option>
                            <option value="Mess incharge" style="background: #1e293b;">Mess Incharge</option>
                            <option value="Librarian" style="background: #1e293b;">Librarian</option>
                            <option value="Office admin" style="background: #1e293b;">Office Admin</option>
                        </select>
                        <i style="position: absolute; right: 15px; font-size: 0.8rem; pointer-events: none;">▼</i>
                    </div>
                </div>
                <div class="form-group">
                    <label for="username">Username / Staff ID</label>
                    <div class="input-wrapper">
                        <i>👤</i>
                        <input type="text" id="username" name="username" placeholder="Enter your username" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i>🔒</i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="error-message" id="errorMsg">
                    <!-- Error messages will appear here -->
                </div>

                <button type="submit" class="login-btn">Login to Dashboard</button>
            </form>
            
            <div class="login-footer">
                <p>Forgot password? Contact <a href="#">System Admin</a></p>
                <a href="/" class="back-home">← Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        // Handle URL parameters for errors
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const errorMsg = document.getElementById('errorMsg');
        
        if (error === '1') {
            errorMsg.innerText = "Invalid username or password.";
            errorMsg.style.display = "block";
        } else if (error === '2') {
            errorMsg.innerText = "Database connection error. Please try again later.";
            errorMsg.style.display = "block";
        } else if (error === '3') {
            errorMsg.innerText = "Session expired. Please login again.";
            errorMsg.style.display = "block";
        }
    </script>
</body>
</html>
