<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password | SmartID</title>
    <link rel="stylesheet" href="/CSS/setPassword.css">
</head>
<body>
    <div class="container">
        <div class="stepper">
            <div class="step completed">
                <div class="step-icon">✓</div>
                <div class="step-label">Verify</div>
            </div>
            <div class="step completed">
                <div class="step-icon">✓</div>
                <div class="step-label">OTP</div>
            </div>
            <div class="step active">
                <div class="step-icon">3</div>
                <div class="step-label">Secure</div>
            </div>
        </div>

        <h2>Create Password</h2>
        <p class="subtitle">Secure your account with a strong password.</p>

        <div class="form-group">
            <label>New Password</label>
            <input type="password" id="password" placeholder="Minimum 6 characters" required>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Repeat password" required>
        </div>

        <button onclick="setPassword()" id="mainBtn">
            <span id="btnText">Finalize & Save</span>
            <div id="spinner" class="spinner"></div>
        </button>

        <div id="toast" class="toast"></div>
    </div>

    <script src="/JS/page3.js"></script>
</body>
</html>
